name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Organizar arquivos
        run: |
          mkdir -p app/src/main/java/com/ramboost/app
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv Cleaner.kt AutoCleanJob.kt MainActivity.kt app/src/main/java/com/ramboost/app/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RamBoost-APK
          path: app/build/outputs/apk/debug/app-debug.apk
